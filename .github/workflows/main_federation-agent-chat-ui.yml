# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - federation-agent-chat-ui

on:
 push:
  branches:
   - main
 workflow_dispatch:

jobs:
 build:
  runs-on: ubuntu-latest
  permissions:
   contents: read #This is required for actions/checkout

  steps:
   - uses: actions/checkout@v4

   - name: Install pnpm
     uses: pnpm/action-setup@v4

   - name: Set up Node.js version
     uses: actions/setup-node@v3
     with:
      node-version: '22.x'
      cache: 'pnpm'

   - name: Cache Next.js build cache
     uses: actions/cache@v4
     with:
      path: .next/cache
      key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}
      restore-keys: |
       ${{ runner.os }}-nextjs-

   - name: Install dependencies and build app
     run: |
      pnpm install
      pnpm build

   - name: Zip artifact for deployment
     run: |
      cd .next/standalone
      zip -r -y ../../next.zip . --symlinks
      cd -

   - name: Upload artifact for deployment job
     uses: actions/upload-artifact@v4
     with:
      name: node-app
      path: .
      # path: next.zip

 deploy:
  runs-on: ubuntu-latest
  needs: build
  environment:
   name: 'Production'
   url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
  permissions:
   id-token: write #This is required for requesting the JWT
   contents: read #This is required for actions/checkout

  steps:
   - name: Download artifact from build job
     uses: actions/download-artifact@v4
     with:
      name: node-app

   - name: Unzip artifact for deployment
     run: |
      mkdir .next/standalone
      unzip next.zip -d .next/standalone

   - name: Login to Azure
     uses: azure/login@v2
     with:
      client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5ADB3E8D9980444CA700B2BB1A5417F4 }}
      tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0E428409E1214A848F76C0489CB855E9 }}
      subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_382D02CCB3FF407D90688FF2788C6ECA }}


   - name: 'Deploy to Azure Web App'
     id: deploy-to-webapp
     uses: azure/webapps-deploy@v3
     with:
      app-name: 'federation-agent-chat-ui'
      slot-name: 'Production'
      package: .
      # package: next.zip